name: Canvas CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Package tested plugin
        run: |
          mkdir release
          tar -czf "release/image-agent-canvas-${GITHUB_SHA}.tar.gz" .codex-plugin .mcp.json assets dist mcp scripts skills src index.html vite.config.js package.json package-lock.json README.md
          cd release
          sha256sum *.tar.gz > SHA256SUMS
      - name: Verify archive contents
        run: |
          tar -tzf "release/image-agent-canvas-${GITHUB_SHA}.tar.gz" | tee release/contents.txt
          test -s dist/index.html
          cd release
          sha256sum --check SHA256SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check && npm run build
      - name: Publish verified plugin archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const pkg=JSON.parse(fs.readFileSync("package.json")); if(process.env.GITHUB_REF_NAME !== `v${pkg.version}`) throw new Error("Release tag must match package.json version");'
          mkdir release
          tar -czf "release/image-agent-canvas-${GITHUB_REF_NAME}.tar.gz" .codex-plugin .mcp.json assets dist mcp scripts skills src index.html vite.config.js package.json package-lock.json README.md
          cd release
          sha256sum *.tar.gz > SHA256SUMS
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" ./*.tar.gz SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
